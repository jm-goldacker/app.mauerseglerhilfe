server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # __CONNECT_SRC__ wird beim Containerstart vom Entrypoint aus API_URL/KEYCLOAK_URL ersetzt
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CONNECT_SRC__; font-src 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
