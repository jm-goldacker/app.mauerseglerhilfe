server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # X-Frame-Options/X-Content-Type-Options/Referrer-Policy setzt der
    # Reverse-Proxy (nginx-proxy/) - hier nicht doppeln, sonst kommen die
    # Header zweifach beim Browser an. Die CSP gehoert der App selbst.
    # __CONNECT_SRC__ wird beim Containerstart vom Entrypoint aus API_URL/KEYCLOAK_URL ersetzt
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CONNECT_SRC__; font-src 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
