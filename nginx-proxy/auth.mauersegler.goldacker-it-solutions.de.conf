server {
    listen 80;
    server_name auth.mauersegler.goldacker-it-solutions.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.mauersegler.goldacker-it-solutions.de;

    ssl_certificate     /etc/letsencrypt/live/auth.mauersegler.goldacker-it-solutions.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.mauersegler.goldacker-it-solutions.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
