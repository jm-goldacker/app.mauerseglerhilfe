services:
  api:
    image: mgoldacker/api-mauerseglerhilfe:latest
    restart: unless-stopped
    ports:
      - "5078:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DBConnection=Server=postgres;Port=5432;Database=mauerseglerhilfe;User Id=${DB_USER};Password=${DB_PASSWORD};
      - Keycloak__Authority=http://keycloak:8080/auth/realms/master
      - Keycloak__RequireHttps=false
      - Keycloak__ValidateAudience=true
      - Keycloak__ValidAudience=account
      - Keycloak__ValidateIssuer=true
      - Keycloak__ValidIssuer=http://localhost:8090/auth/realms/master
    networks:
      - mauerseglerhilfe-dev
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    restart: unless-stopped
    command: start-dev
    ports:
      - "8090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
    networks:
      - mauerseglerhilfe-dev
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mauerseglerhilfe
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - mauerseglerhilfe-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mauerseglerhilfe"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_keycloak_dev_data:/var/lib/postgresql/data
    networks:
      - mauerseglerhilfe-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  postgres_keycloak_dev_data:

networks:
  mauerseglerhilfe-dev:
    name: mauerseglerhilfe-dev
